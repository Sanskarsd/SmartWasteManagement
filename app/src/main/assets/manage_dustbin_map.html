<!DOCTYPE html>
<html>
<head>
    <title>Dustbin Location Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // Initialize the map, centered on India (or any default location)
    var map = L.map('map').setView([20.5937, 78.9629], 5);  // Ensure the zoom level is appropriate

    // Add OpenStreetMap tiles to the map
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Function to add a marker on the map
    function addMarker(latitude, longitude) {
        L.marker([latitude, longitude]).addTo(map)
            .bindPopup('Dustbin Location: ' + latitude + ', ' + longitude)
            .openPopup();
    }
</script>

</body>
</html>
